name: Měsíční aktualizace indexu

on:
  schedule:
    - cron: "30 5 11-25 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testy modelu
        run: python -I -m unittest discover -s tests
      - name: Stažení dat a přepočet
        env:
          ARAD_API_KEY: ${{ secrets.ARAD_API_KEY }}
        run: python src/update.py
      - name: Kontrola stránky
        run: node tests/test_page.js
      - name: Commit změn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet -I'"aktualizovano"'; then
            echo "Žádná nová data."
          else
            git commit -m "Aktualizace dat $(date -u +%Y-%m-%d)"
            git push
          fi
